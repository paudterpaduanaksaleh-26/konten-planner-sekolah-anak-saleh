<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="Pusat akses Content Planner Sekolah Anak Saleh.">
  <title>Content Planner | Sekolah Anak Saleh</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #193b32; background: #f5f7f2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; }
    main { width: min(100%, 680px); padding: clamp(30px, 7vw, 64px); border: 1px solid #e2e9e1; border-radius: 28px; background: #fff; box-shadow: 0 24px 70px #193b3212; }
    .mark { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 18px; background: #e8f2e9; color: #276749; font-weight: 800; letter-spacing: -.06em; }
    .eyebrow { margin: 28px 0 10px; color: #56826b; font-size: .78rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 520px; margin: 0; font-size: clamp(2rem, 6vw, 3.35rem); line-height: 1.08; letter-spacing: -.045em; }
    .intro { max-width: 500px; margin: 18px 0 30px; color: #65766f; font-size: 1.05rem; line-height: 1.7; }
    a.button { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; border-radius: 13px; background: #276749; color: white; font-weight: 700; text-decoration: none; transition: background .18s, transform .18s; }
    a.button:hover { background: #1f553c; transform: translateY(-1px); }
    a.button:focus-visible { outline: 3px solid #95c9a8; outline-offset: 3px; }
    .arrow { font-size: 1.25rem; }
    footer { margin-top: 38px; padding-top: 20px; border-top: 1px solid #edf0ec; color: #84918b; font-size: .84rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SA</div>
    <p class="eyebrow">Sekolah Anak Saleh</p>
    <h1>Content Planner</h1>
    <p class="intro">Ruang kerja untuk merencanakan, mengelola, dan memantau konten sekolah. Masuk ke aplikasi untuk melihat jadwal sesuai akses Anda.</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbwU7LVdlGy_lJLg1oZ4f_25i6iKIQx9GYJo4y4WVrgRsR_0Slh2sK5u_OssA1ck_lRm/exec" target="_blank" rel="noopener noreferrer">
      Buka aplikasi <span class="arrow" aria-hidden="true">→</span>
    </a>
    <footer>Data dan proses masuk tetap dikelola oleh aplikasi Google Apps Script Sekolah Anak Saleh.</footer>
  </main>
</body>
</html>
